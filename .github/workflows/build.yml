name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies & Clean Bad Packages
        run: |
          npm install
          npm uninstall @expo/dom-webview
          npx expo install expo-modules-core

      - name: Clean Existing Native Folder & Prebuild
        run: |
          rm -rf android
          npx expo prebuild --platform android --clean

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -x test --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bluetooth-Tracker-APK
          path: android/app/build/outputs/apk/release/app-release.apk
